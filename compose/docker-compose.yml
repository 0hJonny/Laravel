services:
  postgres:
    container_name: laravel_postgres
    build:
      context: ../postgres
      dockerfile: Dockerfile
    shm_size: 1g
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/initdb:/docker-entrypoint-initdb.d:ro
    environment:
      LANG: ru_RU.utf8
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=ru_RU"
      POSTGRES_USER: ${DATASOURCE_USER}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
      POSTGRES_DB: ${DATASOURCE_DB}
      TZ: Asia/Yekaterinburg
      PGTZ: Asia/Yekaterinburg
    networks:
      - db_network
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DATASOURCE_USER} -d ${DATASOURCE_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
      - ../minio/init-buckets.sh:/docker-entrypoint-initdb.d/init-buckets.sh:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  app:
    container_name: laravel_app
    build:
      context: ../laravel
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DATASOURCE_DB}
      DB_USERNAME: ${DATASOURCE_USER}
      DB_PASSWORD: ${DATASOURCE_PASSWORD}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_TIMEZONE: ${APP_TIMEZONE}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stack
      LOG_LEVEL: error
      SESSION_DRIVER: file
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${AWS_BUCKET}
      AWS_ENDPOINT: ${MINIO_API_URL}
      AWS_URL: ${AWS_URL}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      FILESYSTEM_DISK: s3
      SESSION_SECURE_COOKIE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - db_network
      - app_network
    volumes:
      - app_storage:/var/www/html/storage
      - app_logs:/var/www/html/storage/logs
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  vue:
    container_name: vue_app
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_APP_S3_URL: ${VITE_APP_S3_URL}
    networks:
      - app_network
    volumes:
      - vue_dist:/usr/share/nginx/html
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/nginx/html/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    container_name: nginx_proxy
    image: nginx:1.25-alpine
    restart: unless-stopped
    volumes:
      # - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/sites-enabled:/etc/nginx/conf.d:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
      - ../nginx/certbot-www:/var/www/certbot:ro
      - ../laravel/60941kkv:/var/www/html:ro
      - vue_dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
      vue:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  certbot:
    container_name: certbot
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - ../nginx/ssl:/etc/letsencrypt
      - ../nginx/certbot-www:/var/www/certbot
      - ../scripts:/scripts
    depends_on:
      - nginx
    networks:
      - app_network
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot && nginx -s reload; sleep 12h & wait $${!}; done;'"

networks:
  db_network:
    driver: bridge
  app_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  app_storage:
  app_logs:
  vue_dist:
